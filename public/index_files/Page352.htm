<span style="font-family:Georgia;color:#0099FF;font-weight:bold;
  language:EN">The study of yoga consists of three different aspects of 
training, that is, the Physical, Mental and the Spiritual, The Training and 
control of the physical body and the mind through certain exercises intended to 
pave the way for Spiritual accomplishment, which is the ultimate objective of 
any student of Yoga.</span></p>
<p class="MsoNormal" style="text-align: justify">
<span style="font-family:Arial;language:EN">&nbsp;&nbsp;</span></p>
<p class="MsoNormal"><span style="font-family:Arial;language:EN">&nbsp;</span></p>
<p class="MsoNormal" style="text-align:center;text-align:center">
<span style="font-family:Arial;color:#990033;font-weight:bold;language:EN"><![if !supportEmptyParas]>
&nbsp;<![endif]></span></p>
<p class="MsoNormal" style="text-align:center;text-align:center">
<span style="font-family:Arial;color:#990033;font-weight:bold;language:EN"><![if !supportEmptyParas]>
&nbsp;<![endif]></span></p>
<p class="MsoNormal" style="text-align:center;text-align:center">
<span style="font-family:Georgia;color:#990033;font-weight:bold;language:EN"><![if !supportEmptyParas]>
&nbsp;<![endif]></span></p>
<p class="MsoNormal" style="text-align:center;text-align:center">
<span style="font-family:Georgia;color:#990033;font-weight:bold;language:EN">
PRACTICES</span></p>
<p class="MsoNormal" style="text-align:justify;text-justify:newspaper;
  text-kashida-space:50%;text-align:justify;text-justify:newspaper;text-kashida-space:
  50%"><span style="font-family:Georgia;language:EN">&nbsp;</span></p>
<p class="MsoNormal" style="text-align: justify; text-kashida-space: 50%">
<span style="font-family:Georgia;color:#0099FF;font-weight:bold;
  language:EN">The Physical exercises start with the cleansing the internal 
organs and these form the Kriya Yoga practices. The Asanas come next and these 
exercises aim at control of different parts of the body. After perfection of the 
above physical aspects of the training, the emphasis shifts to the mental field. 
Pranayama is studied and mental concentration is developed, leading to 
Meditation. Meditation on one&#39;s own self and on one&#39;s own divine power, and 
their realisation, has been the underlying aspect of Spiritualism all through 
the ages.</span></p>
<p class="MsoBodyText3">
<span style="font-family:Arial;font-weight:bold;
  language:EN">&nbsp;&nbsp;</span></p>
<p class="MsoBodyText3" style="text-align:center;text-align:center">
<span style="font-family:Arial;color:#990033;font-weight:bold;language:EN"><![if !supportEmptyParas]>
&nbsp;<![endif]></span></p>
<p class="MsoBodyText3" style="text-align:center;text-align:center">
<span style="font-family:Arial;color:#990033;font-weight:bold;language:EN"><![if !supportEmptyParas]>
&nbsp;<![endif]></span></p>
<p class="MsoBodyText3" style="text-align:center;text-align:center">
<span style="font-family:Georgia;color:#990033;font-weight:bold;language:EN">
OBJECTIVE</span></p>
<p class="MsoBodyText3" style="text-align: justify; text-kashida-space: 50%">
<span style="font-family:Georgia;color:#0099FF;font-weight:bold;
  language:EN">True to the meaning of the word yoga, this would lead to the 
union of Spirit and Matter. The training in Yoga has a great ideal as its 
Objective, which can only be accomplished through regular persistent efforts on 
the part of the student throughout his life. Other physical and Mental benefits 
accompanying the various practices are considered as secondary, in the light of 
the Spiritual Proficiency attained. During meditation, the mind is kept in full 
awareness and in supreme consciousness, in which state it transcends all 
physical and mental barriers to reach Samadhi or ultimate bliss and Spiritual 
enlightenment. In due course you will contribute in your way, to save life, in 
all its forms, on this planet.</span></p>
